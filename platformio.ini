[platformio]
default_envs = xiao_rp2350_controller, xiao_esp32c5_scanner
extra_configs = platformio.local.ini

[pico_controller_base]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
platform_packages =
    framework-arduinopico @ https://github.com/earlephilhower/arduino-pico.git#832f2c0650585775270b952e49a0623079c6cd42
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/patch_tinyusb_cdc.py
board_build.filesystem_size = 0.5m
build_src_filter =
    +<controller_main.cpp>
    +<controller_gnss_runtime.cpp>
    +<controller_scanner_runtime.cpp>
    +<controller_update_runtime.cpp>
    +<controller_mtp_storage.cpp>
lib_deps =
    greiman/SdFat@^2.2.3
    mikalhart/TinyGPSPlus@^1.0.3
    adafruit/Adafruit NeoPixel@^1.12.0
    urban-machine/xxHash@0.8.1-pio.1
build_flags =
    -DUSE_TINYUSB
    -DCFG_TUSB_CONFIG_FILE=\"custom_tusb_config.h\"
    -Iinclude
    -DWIFI_DEDUPE_HASH_BITS=64

[env:pico2_controller]
extends = pico_controller_base
board = rpipico2
build_flags =
    ${pico_controller_base.build_flags}
    ; Legacy Pico2 PoC deltas from the XIAO-oriented defaults in Configuration.h.
    -DGNSS_UART=Serial2
    -DGNSS_TX=8
    -DGNSS_RX=9
    -DSD_PIN_CS=5
    -DESP_PIN_CS=13
    -DSCANNER_USE_SHIFTREG_CS=0
    -DSCANNER_SHIFTREG_OE_PIN=16
    -DSCANNER_SHIFTREG_LATCH_PIN=15
    -DRGB_PIN=14

[env:xiao_rp2350_controller]
extends = pico_controller_base
board = seeed_xiao_rp2350

; ---------------------------------------------------------------------------
; Fox-hunt controller builds.
;
; Same hardware and scanner firmware as xiao_rp2350_controller. The differences
; are that the channel sweep is narrowed to the channels one target can appear
; on, and that the target BSSID is exempt from dedupe so every sighting prints
; a live RSSI line on the USB console instead of being reported once and then
; suppressed for the rest of the session.
;
; Set HUNT_TARGET_BSSID to the fox you are chasing before flashing. A malformed
; BSSID is reported at boot rather than silently matching nothing.
; ---------------------------------------------------------------------------
[hunt_controller_base]
extends = pico_controller_base
board = seeed_xiao_rp2350
build_flags =
    ${pico_controller_base.build_flags}
    -DHUNT_MODE_ENABLED=1
    ; A narrowed sweep completes several times a second; logging every cycle
    ; would bury the [HUNT] lines the hunter is watching for.
    -DLOG_SWEEP_CYCLE_COMPLETE=0

; 2.4GHz AP fox: sweeps channels 1-11 only.
[env:hunt_ap_24]
extends = hunt_controller_base
build_flags =
    ${hunt_controller_base.build_flags}
    -DCHANNEL_PLAN=1
    -DHUNT_TARGET_BSSID=\"F2:22:28:43:1E:7C\"

; 5GHz AP fox: sweeps the nine non-DFS channels the 5GHz foxes select from.
[env:hunt_ap_5g]
extends = hunt_controller_base
build_flags =
    ${hunt_controller_base.build_flags}
    -DCHANNEL_PLAN=2
    -DHUNT_TARGET_BSSID=\"F2:2F:E4:6B:D2:9E\"

[esp32_scanner_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 80000000L
build_src_filter = +<scanner_main.cpp>
lib_deps =
    urban-machine/xxHash@0.8.1-pio.1
build_flags =
    -Iinclude
    -DLOG_DEDUPE_HITS=1
    -DWIFI_DEDUPE_HASH_BITS=64

[env:esp32c5_devkit_scanner]
extends = esp32_scanner_base
board = esp32-c5-devkitc1-n8r4
build_flags =
    ${esp32_scanner_base.build_flags}
    -DPIN_SCK=6
    -DPIN_MOSI=1
    -DPIN_MISO=0
    -DPIN_CS=24
    -DSCANNER_SPI_MISO_DRIVE_CAP=GPIO_DRIVE_CAP_3

[env:xiao_esp32c5_scanner]
extends = esp32_scanner_base
board = seeed_xiao_esp32c5
build_flags =
    ${esp32_scanner_base.build_flags}
    ; Route Serial to USB CDC on boot. Pin/LED/SPI drive defaults live in code.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

[env:xiao_esp32c5_scanner_diag]
extends = esp32_scanner_base
board = seeed_xiao_esp32c5
build_src_filter = +<scanner_spi_activity_diag.cpp>
build_flags =
    ${esp32_scanner_base.build_flags}
    ; Route Serial to USB CDC on boot for the standalone SPI activity monitor.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

[env:esp32c5_devkit_scanner_diag]
extends = esp32_scanner_base
board = esp32-c5-devkitc1-n8r4
build_src_filter = +<scanner_spi_activity_diag.cpp>
build_flags =
    ${esp32_scanner_base.build_flags}
    -DPIN_SCK=6
    -DPIN_MOSI=1
    -DPIN_MISO=0
    -DPIN_CS=24
    ; Keep the devkit diagnostic on the same serial path as the normal devkit scanner target.

[native_test_base]
platform = native
test_framework = unity
lib_deps =
    urban-machine/xxHash@0.8.1-pio.1
build_flags =
    -Iinclude
    -DLOG_DEDUPE_HITS=0

[env:native_tests]
extends = native_test_base
build_flags =
    ${native_test_base.build_flags}
    -DWIFI_DEDUPE_HASH_BITS=64

[env:native_tests_hash32]
extends = native_test_base
build_flags =
    ${native_test_base.build_flags}
    -DWIFI_DEDUPE_HASH_BITS=32

[env:native_tests_hash128]
extends = native_test_base
build_flags =
    ${native_test_base.build_flags}
    -DWIFI_DEDUPE_HASH_BITS=128

; The channel-plan presets change the sweep the other suites assert against, so
; each preset gets its own env restricted to the plan-aware suite.
[env:native_tests_plan_24g]
extends = native_test_base
test_filter = test_channel_plan
build_flags =
    ${native_test_base.build_flags}
    -DWIFI_DEDUPE_HASH_BITS=64
    -DCHANNEL_PLAN=1

[env:native_tests_plan_5g]
extends = native_test_base
test_filter = test_channel_plan
build_flags =
    ${native_test_base.build_flags}
    -DWIFI_DEDUPE_HASH_BITS=64
    -DCHANNEL_PLAN=2
